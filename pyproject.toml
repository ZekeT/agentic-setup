[project]
name = "agentic-starter"
version = "4.0.0"
description = "Small external onboarding tools for Matt Pocock's development workflow"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.14.0", "mypy>=1.10.0", "pytest>=8.0.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
"engineering" = ["UP036", "E402"]
